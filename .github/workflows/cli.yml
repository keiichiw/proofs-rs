name: CLI and service checks
on:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: 1.91.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.rust }}
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Check crates.io package
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          cargo publish --dry-run --locked --registry crates-io
          cargo package --locked
          cargo build --manifest-path target/package/cargo-proofs-*/Cargo.toml --target-dir target/package-check --locked
          python3 target/package/cargo-proofs-*/tests/preview.py target/package-check/debug/cargo-proofs
          python3 -c 'from pathlib import Path; assert any(p.stat().st_size for p in Path("target/package").glob("*.crate")), "Missing release archive"'
      - run: python3 tests/e2e.py target/debug/cargo-proofs
      - run: python3 tests/preview.py target/debug/cargo-proofs
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run -- proofs --help
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.45"
      - run: npm ci
      - run: npm run check:preview
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  lean-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          # Elan installs toolchains lazily; finish before tests launch Lean in parallel.
          "$HOME/.elan/bin/lean" +leanprover/lean4:v4.35.0 --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check generated audit with real Lean and Aeneas
        working-directory: cli
        run: cargo test --locked aeneas::tests::real_ -- --ignored
      - name: Record, publish locally, and render real formal evidence
        run: |
          python3 cli/tests/aeneas_e2e.py cli/target/debug/cargo-proofs /tmp/aeneas-record
          PROOFS_REAL_AENEAS_RECORD=/tmp/aeneas-record/record.json node --import tsx --test --test-name-pattern='real Aeneas run' tests/app.test.ts
